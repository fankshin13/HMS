[project]
name = "vuln-assessment-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ANN", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "models", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "error",
  # starlette TestClient의 httpx 사용 중단 경고(상위 라이브러리 이슈). 대체 클라이언트 검증 후 제거.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
