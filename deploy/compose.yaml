# 사내 클라우드 VM 이관용 (Docker Compose v2). 저장소 루트에서:
#   docker compose -f deploy/compose.yaml --env-file deploy/.env up -d --build
# deploy/.env 는 커밋하지 않는다(deploy/env.example 참고, 권한 600).
name: hms

services:
  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?}
    image: hms-web:latest
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL:?}
      INVITATION_TOKEN_SALT: ${INVITATION_TOKEN_SALT:?}
    # 앞단 리버스 프록시(사내 L7/Nginx, TLS 종료)만 접근하도록 루프백에 바인딩
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  worker:
    build:
      context: ../backend
    image: hms-worker:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
      SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?}
    # 대량 진단 시: docker compose ... up -d --scale worker=3
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          memory: 2g
