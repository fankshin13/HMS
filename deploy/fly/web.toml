# Fly.io 웹 앱 (Next.js). 배포 명령은 docs/deploy.md 참고 — 저장소 루트에서 실행한다.
app = "hmva"                # 서비스 주소 https://hmva.fly.dev
primary_region = "nrt"     # 도쿄: Supabase(ap-northeast-1)와 같은 지역

# 공개 값(브라우저 번들에 포함). 시크릿을 여기에 두지 말 것.
[build.args]
  NEXT_PUBLIC_SUPABASE_URL = "https://ghcpajruzahivwewpktx.supabase.co"
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_CshdhSA_d8ibFrgS2h92Iw_KSQCi-eB"

[env]
  PORT = "3000"
  TZ = "Asia/Seoul"
  APP_URL = "https://hmva.fly.dev"  # 공개 값. 시크릿은 fly secrets 로만.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/auth/verify"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
