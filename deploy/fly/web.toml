# Fly.io 웹 앱 (Next.js). 배포 명령은 docs/deploy.md 참고 — 저장소 루트에서 실행한다.
app = "hms-web"            # 실제 앱 이름으로 바꿀 것(전역에서 유일해야 함)
primary_region = "nrt"     # 도쿄: Supabase(ap-northeast-1)와 같은 지역

[env]
  PORT = "3000"
  TZ = "Asia/Seoul"
  # APP_URL 은 사용자 도메인이 정해지면 여기에 둔다(공개 값). 시크릿은 fly secrets 로만.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/auth/verify"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
